one_sentence: >-
  A prototype TypeScript library that encodes content-planning, narrative,
  analytics, and growth heuristics for a chess creator without yet ingesting
  platform data or providing an end-user application.
problem: >-
  Independent chess creators need a repeatable way to frame serial stories,
  inspect content choices, review supplied performance data, and challenge the
  assumptions behind a growth plan without mistaking the model for proven
  channel performance.
intended_users:
  - chess creators and content operators evaluating the proposed workflow
  - software engineers inspecting the prototype utilities
  - project evaluators inspecting scope, authorship, and evidence
implementation_status: PROTOTYPE
